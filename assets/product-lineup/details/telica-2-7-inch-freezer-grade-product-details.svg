<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="1209" viewBox="0 0 720 1209" role="img" aria-labelledby="title desc">
<title id="title">TELICA USA 2.7-inch Freezer-Grade ESL product details</title>
<desc id="desc">TE-27C-Q2N black-and-white freezer-grade electronic shelf label. 152 by 296 pixels at 125 DPI. Operating range minus 13 to 50 degrees Fahrenheit. Approximate battery life of seven years with two updates per day. Applications include chilled meat, seafood and vegetables, frozen food cases, and chilled foods and drinks behind glass doors.</desc>
