<text x="39" y="151" fill="#e7e7e7" font-size="27">Product Details · TE-27C-Q2N</text>
<text x="38" y="238" fill="#1d1e20" font-size="27" font-weight="700">For refrigerated and freezer cases</text>
<text x="38" y="270" fill="#53575b" font-size="22">Engineered for wireless communication and</text>
<text x="38" y="296" fill="#53575b" font-size="22">e-paper display operation at low temperatures.</text>
<rect x="38" y="320" width="644" height="162" rx="8" fill="#f5f5f6"/>
