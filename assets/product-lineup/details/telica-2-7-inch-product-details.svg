<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1209" viewBox="0 0 720 1209" role="img" aria-labelledby="title desc">
<title id="title">TELICA USA 2.7-inch Standard ESL product details</title>
<desc id="desc">2.7-inch four-color electronic shelf label for retail shelves and countertop placement with a compatible stand. 152 by 296 pixels at 125 DPI, 2.4 GHz wireless, two CR2450 batteries, 40 tags per box, and one-year warranty. Example applications include grocery and convenience shelving, pharmacy aisles, wine, liquor and specialty retail, and hardware and general merchandise.</desc>
