<text x="39" y="151" fill="#e7e7e7" font-size="27">Product Details</text>
<text x="38" y="238" fill="#1d1e20" font-size="27" font-weight="700">For everyday retail shelf labeling</text>
<text x="38" y="270" fill="#53575b" font-size="22">Use a compatible stand for countertop placement.</text>
