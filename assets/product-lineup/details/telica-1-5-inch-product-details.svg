<title id="title">TELICA USA 1.5-inch Compact ESL product details</title>
<desc id="desc">1.5-inch four-color electronic shelf label. 200 by 200 pixel display, 2.4 GHz wireless, one CR2450 battery, 60 tags per box, and one-year warranty. For cosmetics, personal care, pharmacy and OTC items, small packaged goods, spices, jewelry, accessories, and small electronics.</desc>
