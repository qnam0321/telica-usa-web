<title id="title">TELICA USA 3.7-inch ESL product details</title>
<desc id="desc">3.7-inch three-color electronic shelf label with a larger display for product details, pricing, and promotions. Model TE-37R-Q2N, 240 by 416 pixels at 139 DPI, a two-cell CR2477 lithium battery pack, 30 tags per box, and one-year warranty.</desc>
